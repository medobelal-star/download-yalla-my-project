<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ضغط وتصغير الصور مجاناً | EG.M.Belal</title>
<meta name="description" content="اضغط أي صورة وقلل حجمها أونلاين مجاناً بدون فقدان جودة ملحوظة، مباشرة من متصفحك بدون رفع لأي سيرفر.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <a href="../index.html" class="logo">EG.M.<span>Belal</span></a>
  <a href="../index.html#tools" class="back-link">◀ كل الأدوات</a>
</header>
<div class="container">
  <h1>🖼️ ضغط <span>وتصغير الصور</span></h1>
  <p class="tool-desc">قلل حجم أي صورة بدون فقدان جودة تُذكر — كل حاجة بتتم جوا متصفحك، الصورة متتبعتش لأي سيرفر.</p>
  <div class="card">
    <label>اختار صورة:</label>
    <input type="file" id="imgInput" accept="image/*">
    <label>مستوى الجودة: <span id="qualityVal">80%</span></label>
    <input type="range" id="quality" min="10" max="100" value="80">
    <button class="btn" id="compressBtn" disabled>📦 ضغط الصورة</button>
    <div id="resultArea" style="display:none;">
      <div class="grid-2" style="margin-top:20px;">
        <div><p class="hint">الأصلية</p><canvas id="origCanvas"></canvas><p class="hint" id="origSize"></p></div>
        <div><p class="hint">بعد الضغط</p><canvas id="compCanvas"></canvas><p class="hint" id="compSize"></p></div>
      </div>
      <button class="btn" id="downloadBtn">⬇ تحميل الصورة المضغوطة</button>
    </div>
  </div>
</div>
<footer>© 2026 EG.M.Belal</footer>
<script src="assets/common.js"></script>
<script>
let img = new Image();
const input = document.getElementById('imgInput');
const qualitySlider = document.getElementById('quality');
const qualityVal = document.getElementById('qualityVal');
const compressBtn = document.getElementById('compressBtn');
let compressedBlob = null;

qualitySlider.oninput = () => qualityVal.textContent = qualitySlider.value + '%';

input.onchange = (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    img = new Image();
    img.onload = () => { compressBtn.disabled = false; };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};

compressBtn.onclick = () => {
  const origCanvas = document.getElementById('origCanvas');
  const compCanvas = document.getElementById('compCanvas');
  origCanvas.width = img.width; origCanvas.height = img.height;
  origCanvas.getContext('2d').drawImage(img, 0, 0);

  let w = img.width, h = img.height;
  const maxDim = 1600;
  if(w > maxDim || h > maxDim){
    const ratio = Math.min(maxDim/w, maxDim/h);
    w = Math.round(w*ratio); h = Math.round(h*ratio);
  }
  compCanvas.width = w; compCanvas.height = h;
  compCanvas.getContext('2d').drawImage(img, 0, 0, w, h);

  compCanvas.toBlob((blob) => {
    compressedBlob = blob;
    document.getElementById('origSize').textContent = 'الحجم التقريبي: ' + Math.round(img.src.length/1024) + ' KB';
    document.getElementById('compSize').textContent = 'الحجم بعد الضغط: ' + Math.round(blob.size/1024) + ' KB';
    document.getElementById('resultArea').style.display = 'block';
  }, 'image/jpeg', qualitySlider.value/100);
};

document.getElementById('downloadBtn').onclick = () => {
  if(compressedBlob) downloadBlob(compressedBlob, 'compressed-image.jpg');
};
</script>
</body>
</html>
