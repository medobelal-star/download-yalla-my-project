<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أداة الألوان وتدرجات CSS | EG.M.Belal</title>
<meta name="description" content="اختار لون واستخرج كوده HEX و RGB، أو أنشئ تدريج ألوان (Gradient) وانسخ كود CSS فوراً.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <a href="../index.html" class="logo">EG.M.<span>Belal</span></a>
  <a href="../index.html#tools" class="back-link">◀ كل الأدوات</a>
</header>
<div class="container">
  <h1>🎨 أداة <span>الألوان والتدرجات</span></h1>
  <p class="tool-desc">للمصممين — استخرج أكواد الألوان أو أنشئ Gradient بكود CSS جاهز.</p>

  <div class="card">
    <h3>اختيار لون</h3>
    <input type="color" id="colorInput" value="#00f2fe" style="width:100%; height:60px; border:none; border-radius:10px; cursor:pointer;">
    <div class="color-swatch" id="swatch" style="margin-top:15px; background:#00f2fe;"></div>
    <div class="result-box">
      <p>HEX: <strong id="hexVal">#00f2fe</strong> <button class="btn btn-secondary" onclick="copyToClipboard(document.getElementById('hexVal').textContent, this)">نسخ</button></p>
      <p>RGB: <strong id="rgbVal">rgb(0,242,254)</strong> <button class="btn btn-secondary" onclick="copyToClipboard(document.getElementById('rgbVal').textContent, this)">نسخ</button></p>
    </div>
  </div>

  <div class="card">
    <h3>تدريج ألوان (Gradient)</h3>
    <div class="grid-2">
      <div><label>اللون الأول:</label><input type="color" id="grad1" value="#00f2fe"></div>
      <div><label>اللون الثاني:</label><input type="color" id="grad2" value="#4facfe"></div>
    </div>
    <label>الاتجاه:</label>
    <select id="gradDirection">
      <option value="135deg">قطري</option>
      <option value="to right">لليمين</option>
      <option value="to left">لليسار</option>
      <option value="to bottom">لتحت</option>
      <option value="to top">لفوق</option>
    </select>
    <div id="gradPreview" style="height:100px; border-radius:12px; margin-top:15px; border:1px solid var(--border);"></div>
    <div class="result-box">
      <code id="gradCode">background: linear-gradient(135deg, #00f2fe, #4facfe);</code>
      <button class="btn btn-secondary" onclick="copyToClipboard(document.getElementById('gradCode').textContent, this)">نسخ الكود</button>
    </div>
  </div>
</div>
<footer>© 2026 EG.M.Belal</footer>
<script src="assets/common.js"></script>
<script>
const colorInput = document.getElementById('colorInput');
function hexToRgb(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgb(${r},${g},${b})`;
}
colorInput.oninput = () => {
  document.getElementById('swatch').style.background = colorInput.value;
  document.getElementById('hexVal').textContent = colorInput.value;
  document.getElementById('rgbVal').textContent = hexToRgb(colorInput.value);
};

function updateGradient(){
  const c1 = document.getElementById('grad1').value;
  const c2 = document.getElementById('grad2').value;
  const dir = document.getElementById('gradDirection').value;
  const css = `background: linear-gradient(${dir}, ${c1}, ${c2});`;
  document.getElementById('gradPreview').style.background = `linear-gradient(${dir}, ${c1}, ${c2})`;
  document.getElementById('gradCode').textContent = css;
}
document.getElementById('grad1').oninput = updateGradient;
document.getElementById('grad2').oninput = updateGradient;
document.getElementById('gradDirection').onchange = updateGradient;
updateGradient();
</script>
</body>
</html>
