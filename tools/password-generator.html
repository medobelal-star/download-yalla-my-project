<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولد كلمات مرور قوية وعشوائية مجاناً | Password Generator</title>
<meta name="description" content="أنشئ كلمة سر قوية وعشوائية بنقرة واحدة، بطول وتعقيد تختاره بنفسك، لحماية حساباتك من الاختراق والسرقة.">
<meta name="keywords" content="مولد كلمة سر, انشاء باسورد قوي, password generator online free, strong password generator, كلمة مرور عشوائية, توليد باسورد امن, حماية الحسابات, افضل كلمة سر, generate secure password, random password maker, كلمة سر معقدة اونلاين, secure password creator, انشاء رمز مرور قوي, password strength generator, توليد باسورد بارقام ورموز, create strong password free, حماية الحساب من الاختراق, unique password generator, كلمة مرور صعبة التخمين, online password tool, توليد كلمة مرور wifi, password maker no signup">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <a href="../index.html" class="logo">EG.M.<span>Belal</span></a>
  <a href="../index.html#tools" class="back-link">◀ كل الأدوات</a>
</header>
<div class="container">
  <h1>🔐 مولّد <span>كلمات المرور</span></h1>
  <p class="tool-desc">كلمات سر عشوائية آمنة، بتتولد جوا متصفحك مباشرة.</p>
  <div class="card">
    <div class="result-box" style="text-align:center; font-size:1.3rem; font-family:monospace;" id="passOutput">اضغط توليد</div>
    <button class="btn" onclick="copyToClipboard(document.getElementById('passOutput').textContent, this)" style="width:100%;">📋 نسخ كلمة السر</button>

    <label>طول كلمة السر: <span id="lenVal">16</span></label>
    <input type="range" id="length" min="6" max="64" value="16">

    <label><input type="checkbox" id="upper" checked style="width:auto;"> حروف كبيرة (A-Z)</label>
    <label><input type="checkbox" id="lower" checked style="width:auto;"> حروف صغيرة (a-z)</label>
    <label><input type="checkbox" id="numbers" checked style="width:auto;"> أرقام (0-9)</label>
    <label><input type="checkbox" id="symbols" checked style="width:auto;"> رموز (!@#$%)</label>

    <button class="btn" onclick="generatePassword()">🎲 توليد كلمة سر جديدة</button>
  </div>
</div>
<footer>© 2026 EG.M.Belal</footer>
<script src="assets/common.js"></script>
<script>
document.getElementById('length').oninput = (e) => document.getElementById('lenVal').textContent = e.target.value;

function generatePassword(){
  const len = parseInt(document.getElementById('length').value);
  let chars = '';
  if(document.getElementById('upper').checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if(document.getElementById('lower').checked) chars += 'abcdefghijklmnopqrstuvwxyz';
  if(document.getElementById('numbers').checked) chars += '0123456789';
  if(document.getElementById('symbols').checked) chars += '!@#$%^&*()_+-=[]{}';
  if(!chars){ alert('اختار نوع واحد على الأقل'); return; }

  const array = new Uint32Array(len);
  crypto.getRandomValues(array);
  let password = '';
  for(let i=0; i<len; i++){
    password += chars[array[i] % chars.length];
  }
  document.getElementById('passOutput').textContent = password;
}
generatePassword();
</script>
</body>
</html>
