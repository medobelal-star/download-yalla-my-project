<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار سرعة الإنترنت أونلاين مجاناً | قياس سرعة التحميل والرفع</title>
<meta name="description" content="اختبر سرعة الإنترنت عندك مجاناً وبدقة، قياس فوري لسرعة التحميل والرفع (Download & Upload Speed) بدون تحميل أي برنامج.">
<meta name="keywords" content="اختبار سرعة النت, قياس سرعة الانترنت, speed test online free, internet speed test, سرعة التحميل والرفع, اختبار سرعة الواي فاي, فحص سرعة النت مجانا, قياس سرعة الشبكة, speedtest عربي, download upload speed test, اختبار سرعة الفايبر, wifi speed checker, قياس زمن الاستجابة ping, network speed test free, فحص سرعة خط الانترنت, بيانات سرعة الاتصال, mobile data speed test, اختبار سرعة 4G 5G, بطء الانترنت اختبار, قياس سرعة النت للجوال, internet speed meter online, فحص جودة الاتصال">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <a href="../index.html" class="logo">EG.M.<span>Belal</span></a>
  <a href="../index.html#tools" class="back-link">◀ كل الأدوات</a>
</header>
<div class="container">
  <h1>🚀 اختبار <span>سرعة الإنترنت</span></h1>
  <p class="tool-desc">قياس تقريبي لسرعة التحميل والرفع عندك.</p>
  <div class="card" style="text-align:center;">
    <button class="btn" id="startBtn" onclick="runTest()">ابدأ الاختبار</button>
    <div style="margin-top:25px; font-size:1.1rem;">
      <p>⬇ سرعة التحميل: <strong id="downloadSpeed" style="color:var(--accent);">--</strong></p>
      <p>⬆ سرعة الرفع: <strong id="uploadSpeed" style="color:var(--accent);">--</strong></p>
    </div>
    <p class="hint" id="statusMsg"></p>
  </div>
</div>
<footer>© 2026 EG.M.Belal</footer>
<script>
async function runTest(){
  const statusMsg = document.getElementById('statusMsg');
  document.getElementById('downloadSpeed').textContent = '--';
  document.getElementById('uploadSpeed').textContent = '--';

  // نستخدم سيرفرات Cloudflare المخصصة لاختبارات السرعة، مصممة أصلاً تشتغل من أي موقع (CORS مفعّل)
  try {
    statusMsg.textContent = 'جاري قياس سرعة التحميل...';
    const testBytes = 10_000_000; // 10MB
    const start = performance.now();
    const res = await fetch(`https://speed.cloudflare.com/__down?bytes=${testBytes}`, { cache: 'no-store' });
    const blob = await res.blob();
    const durationSec = (performance.now() - start) / 1000;
    const mbps = ((blob.size * 8) / durationSec / 1_000_000).toFixed(2);
    document.getElementById('downloadSpeed').textContent = mbps + ' Mbps';
  } catch(e){
    document.getElementById('downloadSpeed').textContent = 'تعذر القياس';
  }

  try {
    statusMsg.textContent = 'جاري قياس سرعة الرفع...';
    const uploadData = new Blob([new Uint8Array(5_000_000)]); // 5MB بيانات وهمية
    const start2 = performance.now();
    await fetch('https://speed.cloudflare.com/__up', { method: 'POST', body: uploadData, cache: 'no-store' });
    const durationSec2 = (performance.now() - start2) / 1000;
    const mbps2 = ((uploadData.size * 8) / durationSec2 / 1_000_000).toFixed(2);
    document.getElementById('uploadSpeed').textContent = mbps2 + ' Mbps';
  } catch(e){
    document.getElementById('uploadSpeed').textContent = 'تعذر القياس';
  }

  statusMsg.textContent = 'النتيجة تقريبية وممكن تختلف حسب حالة الشبكة والسيرفرات.';
}
</script>
</body>
</html>
