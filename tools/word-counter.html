<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عداد الكلمات والحروف أونلاين | حساب عدد الكلمات ووقت القراءة</title>
<meta name="description" content="احسب عدد الكلمات والحروف والجمل في أي نص فوراً، مع تقدير وقت القراءة المتوقع، مفيدة لكتّاب المقالات والمحتوى.">
<meta name="keywords" content="عداد الكلمات, حساب عدد الحروف, word counter online, character counter free, حساب عدد كلمات المقال, عداد النصوص اونلاين, حساب وقت القراءة, count words free online, عداد الجمل والفقرات, text word count tool, حساب طول النص, article word counter, عداد كلمات مجاني, character count online free, حساب عدد كلمات السيو, essay word counter, تحليل طول المقال, reading time calculator, عداد الأحرف بالعربي, word count for students, عداد كلمات السيرة الذاتية, online text analyzer tool">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <a href="../index.html" class="logo">EG.M.<span>Belal</span></a>
  <a href="../index.html#tools" class="back-link">◀ كل الأدوات</a>
</header>
<div class="container">
  <h1>🔢 عداد <span>الكلمات والحروف</span></h1>
  <p class="tool-desc">مفيدة لكُتّاب المقالات ومنشئي المحتوى.</p>
  <div class="card">
    <textarea id="textInput" placeholder="الصق أو اكتب نصك هنا..." style="min-height:250px;"></textarea>
    <div class="grid-2" style="margin-top:20px;">
      <div class="result-box">الكلمات: <strong id="wordCount" style="color:var(--accent);">0</strong></div>
      <div class="result-box">الحروف: <strong id="charCount" style="color:var(--accent);">0</strong></div>
      <div class="result-box">الجمل: <strong id="sentenceCount" style="color:var(--accent);">0</strong></div>
      <div class="result-box">وقت القراءة: <strong id="readTime" style="color:var(--accent);">0 دقيقة</strong></div>
    </div>
  </div>
</div>
<footer>© 2026 EG.M.Belal</footer>
<script>
const input = document.getElementById('textInput');
input.oninput = () => {
  const text = input.value;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const chars = text.length;
  const sentences = (text.match(/[.!?؟]+/g) || []).length;
  const minutes = Math.max(1, Math.ceil(words / 200));

  document.getElementById('wordCount').textContent = words;
  document.getElementById('charCount').textContent = chars;
  document.getElementById('sentenceCount').textContent = sentences;
  document.getElementById('readTime').textContent = minutes + ' دقيقة';
};
</script>
</body>
</html>
