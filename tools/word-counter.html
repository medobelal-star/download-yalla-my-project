<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عداد الكلمات والحروف | EG.M.Belal</title>
<meta name="description" content="اعرف عدد الكلمات والحروف ووقت القراءة المتوقع لأي نص فوراً.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <a href="../index.html" class="logo">EG.M.<span>Belal</span></a>
  <a href="../index.html#tools" class="back-link">◀ كل الأدوات</a>
</header>
<div class="container">
  <h1>🔢 عداد <span>الكلمات والحروف</span></h1>
  <p class="tool-desc">مفيدة لكُتّاب المقالات ومنشئي المحتوى.</p>
  <div class="card">
    <textarea id="textInput" placeholder="الصق أو اكتب نصك هنا..." style="min-height:250px;"></textarea>
    <div class="grid-2" style="margin-top:20px;">
      <div class="result-box">الكلمات: <strong id="wordCount" style="color:var(--accent);">0</strong></div>
      <div class="result-box">الحروف: <strong id="charCount" style="color:var(--accent);">0</strong></div>
      <div class="result-box">الجمل: <strong id="sentenceCount" style="color:var(--accent);">0</strong></div>
      <div class="result-box">وقت القراءة: <strong id="readTime" style="color:var(--accent);">0 دقيقة</strong></div>
    </div>
  </div>
</div>
<footer>© 2026 EG.M.Belal</footer>
<script>
const input = document.getElementById('textInput');
input.oninput = () => {
  const text = input.value;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const chars = text.length;
  const sentences = (text.match(/[.!?؟]+/g) || []).length;
  const minutes = Math.max(1, Math.ceil(words / 200));

  document.getElementById('wordCount').textContent = words;
  document.getElementById('charCount').textContent = chars;
  document.getElementById('sentenceCount').textContent = sentences;
  document.getElementById('readTime').textContent = minutes + ' دقيقة';
};
</script>
</body>
</html>
