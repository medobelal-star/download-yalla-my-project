<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دمج وتقسيم ملفات PDF أونلاين مجاناً | Merge & Split PDF</title>
<meta name="description" content="ادمج أكتر من ملف PDF في ملف واحد، أو استخرج صفحات معينة منه مجاناً وبسرعة، بدون رفع ملفاتك لأي سيرفر.">
<meta name="keywords" content="دمج ملفات pdf, تقسيم pdf, merge pdf online free, split pdf tool, دمج pdf مجانا, فصل صفحات pdf, تعديل pdf اونلاين, ضم ملفات pdf في ملف واحد, استخراج صفحة من pdf, combine pdf files online, تقطيع ملف pdf, pdf splitter free, دمج عدة ملفات pdf بترتيب معين, extract pages from pdf online, ضغط ودمج pdf مجانا, join pdf documents online, تحرير ملفات pdf بدون برنامج, free pdf merger tool, فصل صفحة معينة من pdf, pdf page extractor free, دمج pdf من الموبايل, online pdf organizer free">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>
<header>
  <a href="../index.html" class="logo">EG.M.<span>Belal</span></a>
  <a href="../index.html#tools" class="back-link">◀ كل الأدوات</a>
</header>
<div class="container">
  <h1>📄 دمج <span>وتقسيم PDF</span></h1>
  <p class="tool-desc">كل حاجة بتتم جوا متصفحك، ملفاتك متتبعتش لأي سيرفر.</p>

  <div class="card">
    <h3>🔗 دمج ملفات PDF</h3>
    <label>اختار ملفين أو أكتر (بترتيب الدمج):</label>
    <input type="file" id="mergeInput" accept="application/pdf" multiple>
    <button class="btn" id="mergeBtn">دمج الملفات</button>
    <p class="hint" id="mergeStatus"></p>
  </div>

  <div class="card">
    <h3>✂️ استخراج صفحات</h3>
    <label>اختار ملف PDF:</label>
    <input type="file" id="splitInput" accept="application/pdf">
    <div class="grid-2">
      <div><label>من صفحة رقم:</label><input type="number" id="fromPage" value="1"></div>
      <div><label>إلى صفحة رقم:</label><input type="number" id="toPage" value="1"></div>
    </div>
    <button class="btn" id="splitBtn">استخراج الصفحات</button>
    <p class="hint" id="splitStatus"></p>
  </div>
</div>
<footer>© 2026 EG.M.Belal</footer>
<script src="assets/common.js"></script>
<script>
const { PDFDocument } = PDFLib;

document.getElementById('mergeBtn').onclick = async () => {
  const files = document.getElementById('mergeInput').files;
  const status = document.getElementById('mergeStatus');
  if(files.length < 2){ status.textContent = 'اختار ملفين على الأقل'; return; }
  status.textContent = 'جاري الدمج...';
  const mergedPdf = await PDFDocument.create();
  for(const file of files){
    const bytes = await file.arrayBuffer();
    const pdf = await PDFDocument.load(bytes);
    const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
    pages.forEach(p => mergedPdf.addPage(p));
  }
  const mergedBytes = await mergedPdf.save();
  downloadBlob(new Blob([mergedBytes], {type:'application/pdf'}), 'merged.pdf');
  status.textContent = 'تم الدمج والتحميل بنجاح ✓';
};

document.getElementById('splitBtn').onclick = async () => {
  const file = document.getElementById('splitInput').files[0];
  const status = document.getElementById('splitStatus');
  if(!file){ status.textContent = 'اختار ملف الأول'; return; }
  const from = parseInt(document.getElementById('fromPage').value) - 1;
  const to = parseInt(document.getElementById('toPage').value) - 1;
  status.textContent = 'جاري الاستخراج...';
  const bytes = await file.arrayBuffer();
  const pdf = await PDFDocument.load(bytes);
  const newPdf = await PDFDocument.create();
  const indices = [];
  for(let i=from; i<=to; i++) if(i>=0 && i<pdf.getPageCount()) indices.push(i);
  if(indices.length === 0){ status.textContent = 'أرقام الصفحات غير صحيحة'; return; }
  const pages = await newPdf.copyPages(pdf, indices);
  pages.forEach(p => newPdf.addPage(p));
  const newBytes = await newPdf.save();
  downloadBlob(new Blob([newBytes], {type:'application/pdf'}), 'extracted.pdf');
  status.textContent = 'تم الاستخراج والتحميل بنجاح ✓';
};
</script>
</body>
</html>
