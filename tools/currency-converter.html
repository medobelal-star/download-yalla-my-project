<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحويل العملات مباشر | EG.M.Belal</title>
<meta name="description" content="حوّل بين أي عملتين بأسعار الصرف الحية مجاناً وبدون تسجيل.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <a href="../index.html" class="logo">EG.M.<span>Belal</span></a>
  <a href="../index.html#tools" class="back-link">◀ كل الأدوات</a>
</header>
<div class="container">
  <h1>💱 تحويل <span>العملات</span></h1>
  <p class="tool-desc">أسعار صرف حية ومجانية بدون أي تسجيل أو مفتاح API.</p>
  <div class="card">
    <div class="grid-2">
      <div>
        <label>المبلغ:</label>
        <input type="number" id="amount" value="1">
      </div>
      <div>
        <label>من عملة:</label>
        <select id="fromCurrency"></select>
      </div>
    </div>
    <label>إلى عملة:</label>
    <select id="toCurrency"></select>
    <button class="btn" id="convertBtn">🔄 حوّل الآن</button>
    <div class="result-box" id="result" style="display:none;"></div>
    <p class="hint" id="rateInfo"></p>
  </div>
</div>
<footer>© 2026 EG.M.Belal</footer>
<script>
// خدمة مجانية بدون أي API Key - open.er-api.com
const currencies = ["USD","EUR","EGP","SAR","AED","GBP","JPY","CNY","TRY","KWD","QAR","CAD","AUD","CHF","INR"];
const fromSel = document.getElementById('fromCurrency');
const toSel = document.getElementById('toCurrency');
currencies.forEach(c => {
  fromSel.innerHTML += `<option value="${c}" ${c==='USD'?'selected':''}>${c}</option>`;
  toSel.innerHTML += `<option value="${c}" ${c==='EGP'?'selected':''}>${c}</option>`;
});

document.getElementById('convertBtn').onclick = async () => {
  const amount = parseFloat(document.getElementById('amount').value) || 0;
  const from = fromSel.value, to = toSel.value;
  const resultBox = document.getElementById('result');
  resultBox.style.display = 'block';
  resultBox.textContent = 'جاري الجلب...';
  try {
    const res = await fetch(`https://open.er-api.com/v6/latest/${from}`);
    const data = await res.json();
    if(data.result !== 'success') throw new Error('فشل الجلب');
    const rate = data.rates[to];
    const converted = (amount * rate).toFixed(4);
    resultBox.innerHTML = `<strong style="font-size:1.4rem;color:var(--accent);">${converted} ${to}</strong>`;
    document.getElementById('rateInfo').textContent = `سعر الصرف: 1 ${from} = ${rate} ${to} (آخر تحديث: ${data.time_last_update_utc || 'الآن'})`;
  } catch(e){
    resultBox.textContent = 'حصل خطأ في الاتصال، جرب تاني بعد شوية.';
  }
};
</script>
</body>
</html>
