<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحويل النص لصوت والعكس | EG.M.Belal</title>
<meta name="description" content="حوّل أي نص لصوت مباشر، أو تكلم وحول كلامك لنص مكتوب.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <a href="../index.html" class="logo">EG.M.<span>Belal</span></a>
  <a href="../index.html#tools" class="back-link">◀ كل الأدوات</a>
</header>
<div class="container">
  <h1>🔊 نص <span>↔ صوت</span></h1>
  <p class="tool-desc">تحويل ثنائي الاتجاه، شغال بتقنية المتصفح مباشرة (مفيش رفع ملفات).</p>

  <div class="card">
    <h3>📝 من نص إلى صوت</h3>
    <textarea id="ttsText" placeholder="اكتب النص هنا..."></textarea>
    <label>اللغة:</label>
    <select id="ttsLang">
      <option value="ar-SA">العربية</option>
      <option value="en-US">English</option>
    </select>
    <button class="btn" onclick="speakText()">▶ تشغيل الصوت</button>
    <button class="btn btn-secondary" onclick="stopSpeak()">⏹ إيقاف</button>
  </div>

  <div class="card">
    <h3>🎙️ من صوت إلى نص</h3>
    <p class="hint">اضغط "ابدأ التسجيل" وتكلم، والنص هيظهر تلقائي (متاح في متصفح كروم بشكل أساسي).</p>
    <button class="btn" id="startRecBtn" onclick="startRecognition()">🎤 ابدأ التسجيل</button>
    <div class="result-box" id="sttResult" style="display:none;"></div>
  </div>
</div>
<footer>© 2026 EG.M.Belal</footer>
<script>
function speakText(){
  const text = document.getElementById('ttsText').value.trim();
  if(!text) return;
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = document.getElementById('ttsLang').value;
  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
}
function stopSpeak(){ speechSynthesis.cancel(); }

function startRecognition(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    alert('المتصفح ده مش بيدعم تحويل الصوت لنص، جرب جوجل كروم.');
    return;
  }
  const recognition = new SpeechRecognition();
  recognition.lang = 'ar-SA';
  recognition.interimResults = false;
  const resultBox = document.getElementById('sttResult');
  resultBox.style.display = 'block';
  resultBox.textContent = 'بيسمعك دلوقتي... اتكلم';
  recognition.onresult = (event) => {
    resultBox.textContent = event.results[0][0].transcript;
  };
  recognition.onerror = () => { resultBox.textContent = 'حصل خطأ، حاول تاني.'; };
  recognition.start();
}
</script>
</body>
</html>
