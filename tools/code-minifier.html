<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ضغط وتنسيق أكواد HTML CSS JavaScript مجاناً | Code Minifier</title>
<meta name="description" content="قلل حجم كود HTML أو CSS أو JavaScript بضغطة زر (Minify)، أو نسّقه ليصبح مقروء (Beautify) للمطورين ومنشئي المواقع.">
<meta name="keywords" content="ضغط الاكواد, تنسيق كود javascript, code minifier online, css minifier free, html formatter online, beautify code online, تصغير حجم الكود, minify css js html free, ضغط كود html, javascript beautifier online, تنسيق كود css, code formatter free tool, ضغط سكريبت الموقع, reduce code file size, تنظيف كود html, pretty print code online, minify javascript file, format messy code online, ضغط اكواد الموقع للسرعة, developer code compressor, ضغط ملف css اونلاين, javascript minifier free tool">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <a href="../index.html" class="logo">EG.M.<span>Belal</span></a>
  <a href="../index.html#tools" class="back-link">◀ كل الأدوات</a>
</header>
<div class="container">
  <h1>⚡ ضغط <span>وتنسيق الأكواد</span></h1>
  <p class="tool-desc">للمطورين — قلل حجم الكود للنشر، أو نسّقه عشان يبقى مقروء.</p>
  <div class="card">
    <label>نوع الكود:</label>
    <select id="codeType">
      <option value="css">CSS</option>
      <option value="js">JavaScript</option>
      <option value="html">HTML</option>
    </select>
    <textarea id="codeInput" placeholder="الصق الكود هنا..." style="min-height:200px;"></textarea>
    <div class="grid-2" style="margin-top:15px;">
      <button class="btn" onclick="minify()">📦 ضغط الكود</button>
      <button class="btn btn-secondary" onclick="beautify()">📖 تنسيق الكود</button>
    </div>
    <button class="btn btn-secondary" onclick="copyToClipboard(document.getElementById('codeInput').value, this)" style="width:100%;">📋 نسخ النتيجة</button>
  </div>
</div>
<footer>© 2026 EG.M.Belal</footer>
<script src="assets/common.js"></script>
<script>
const ta = document.getElementById('codeInput');

function minify(){
  let code = ta.value;
  const type = document.getElementById('codeType').value;
  if(type === 'css'){
    code = code.replace(/\/\*[\s\S]*?\*\//g, '')
                .replace(/\s+/g, ' ')
                .replace(/\s*([{}:;,])\s*/g, '$1')
                .trim();
  } else if(type === 'js'){
    code = code.replace(/\/\/.*$/gm, '')
                .replace(/\/\*[\s\S]*?\*\//g, '')
                .replace(/\s+/g, ' ')
                .trim();
  } else {
    code = code.replace(/<!--[\s\S]*?-->/g, '')
                .replace(/>\s+</g, '><')
                .replace(/\s+/g, ' ')
                .trim();
  }
  ta.value = code;
}

function beautify(){
  let code = ta.value;
  const type = document.getElementById('codeType').value;
  if(type === 'css'){
    code = code.replace(/\s*{\s*/g, ' {\n  ')
                .replace(/;\s*/g, ';\n  ')
                .replace(/\s*}\s*/g, '\n}\n');
  } else if(type === 'js'){
    code = code.replace(/;\s*/g, ';\n')
                .replace(/{\s*/g, ' {\n  ')
                .replace(/}\s*/g, '\n}\n');
  } else {
    code = code.replace(/></g, '>\n<');
  }
  ta.value = code;
}
</script>
</body>
</html>
