<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولد التوقيع الإلكتروني مجاناً | إنشاء توقيع رقمي PNG شفاف</title>
<meta name="description" content="ارسم توقيعك بالماوس أو باللمس ونزّله كصورة شفافة PNG جاهزة للاستخدام في العقود والمستندات الرسمية.">
<meta name="keywords" content="توقيع الكتروني, انشاء امضاء رقمي, signature generator online, digital signature maker, توقيع شفاف png, امضاء اونلاين, رسم توقيع بالماوس, create signature online free, توقيع للعقود والمستندات, e-signature creator, رسم امضاء بالتاتش, signature pad online, توقيع الكتروني مجاني, handwritten signature online, انشاء توقيع للايميل, digital signature for documents, توقيع رقمي شفاف تحميل, online signature maker free, امضاء الكتروني للعقود, signature image generator, توقيع الكتروني للجوال, free online signature pad">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <a href="../index.html" class="logo">EG.M.<span>Belal</span></a>
  <a href="../index.html#tools" class="back-link">◀ كل الأدوات</a>
</header>
<div class="container">
  <h1>✍️ مولّد <span>التوقيع الإلكتروني</span></h1>
  <p class="tool-desc">ارسم توقيعك بالماوس أو التاتش، ونزّله كصورة شفافة جاهزة للاستخدام في العقود.</p>
  <div class="card">
    <canvas id="sigCanvas" width="600" height="250" style="width:100%; touch-action:none; cursor:crosshair;"></canvas>
    <div class="grid-2" style="margin-top:15px;">
      <div><label>سمك الخط:</label><input type="range" id="lineWidth" min="1" max="8" value="3"></div>
      <div><label>لون القلم:</label><input type="color" id="penColor" value="#000000" style="height:44px;"></div>
    </div>
    <div class="grid-2" style="margin-top:15px;">
      <button class="btn btn-secondary" onclick="clearCanvas()">🗑 مسح</button>
      <button class="btn" onclick="downloadSignature()">⬇ تحميل PNG شفاف</button>
    </div>
  </div>
</div>
<footer>© 2026 EG.M.Belal</footer>
<script src="assets/common.js"></script>
<script>
const canvas = document.getElementById('sigCanvas');
const ctx = canvas.getContext('2d');
let drawing = false;
let lastX = 0, lastY = 0;

function getPos(e){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleX };
}

function startDraw(e){ drawing = true; const p = getPos(e); lastX = p.x; lastY = p.y; e.preventDefault(); }
function draw(e){
  if(!drawing) return;
  const p = getPos(e);
  ctx.strokeStyle = document.getElementById('penColor').value;
  ctx.lineWidth = document.getElementById('lineWidth').value;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  lastX = p.x; lastY = p.y;
  e.preventDefault();
}
function endDraw(){ drawing = false; }

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('mouseleave', endDraw);
canvas.addEventListener('touchstart', startDraw);
canvas.addEventListener('touchmove', draw);
canvas.addEventListener('touchend', endDraw);

function clearCanvas(){ ctx.clearRect(0, 0, canvas.width, canvas.height); }
function downloadSignature(){
  canvas.toBlob(blob => downloadBlob(blob, 'signature.png'));
}
</script>
</body>
</html>
