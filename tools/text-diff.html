<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مقارنة النصوص وإيجاد الفروقات أونلاين | Text Diff Checker</title>
<meta name="description" content="قارن بين نصين واعرف الفروقات والتعديلات بينهم فوراً بألوان واضحة، مفيدة للمبرمجين ومحرري المحتوى.">
<meta name="keywords" content="مقارنة نصوص, text diff checker online, compare text free, ايجاد الفروقات بين نصين, مقارنة ملفات نصية, text comparison tool, اكتشاف الفرق بين نصين, diff checker online free, مقارنة اصدارين من نص, compare two documents online, مقارنة كود برمجي, side by side text compare, ايجاد التعديلات في النص, text difference highlighter, مقارنة فقرات نصية, online diff tool free, مقارنة محتوى مقالين, text merge comparison, اداة مقارنة النصوص العربية, compare paragraphs online, مقارنة نص عربي وانجليزي, free document diff tool">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <a href="../index.html" class="logo">EG.M.<span>Belal</span></a>
  <a href="../index.html#tools" class="back-link">◀ كل الأدوات</a>
</header>
<div class="container">
  <h1>🔍 مقارنة <span>النصوص</span></h1>
  <p class="tool-desc">حط النص القديم والجديد وشوف الفرق بينهم بالألوان.</p>
  <div class="card">
    <div class="grid-2">
      <div><label>النص الأول:</label><textarea id="text1" style="min-height:180px;"></textarea></div>
      <div><label>النص التاني:</label><textarea id="text2" style="min-height:180px;"></textarea></div>
    </div>
    <button class="btn" onclick="compareDiff()" style="width:100%;">قارن الآن</button>
    <div class="result-box" id="diffResult" style="display:none; line-height:2;"></div>
  </div>
</div>
<footer>© 2026 EG.M.Belal</footer>
<script>
function lcsDiff(a, b){
  const m = a.length, n = b.length;
  const dp = Array.from({length: m+1}, () => new Array(n+1).fill(0));
  for(let i=1; i<=m; i++)
    for(let j=1; j<=n; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);

  const result = [];
  let i = m, j = n;
  while(i>0 && j>0){
    if(a[i-1] === b[j-1]){ result.unshift({type:'same', text:a[i-1]}); i--; j--; }
    else if(dp[i-1][j] >= dp[i][j-1]){ result.unshift({type:'del', text:a[i-1]}); i--; }
    else { result.unshift({type:'add', text:b[j-1]}); j--; }
  }
  while(i>0){ result.unshift({type:'del', text:a[i-1]}); i--; }
  while(j>0){ result.unshift({type:'add', text:b[j-1]}); j--; }
  return result;
}

function compareDiff(){
  const words1 = document.getElementById('text1').value.split(/(\s+)/).filter(w=>w);
  const words2 = document.getElementById('text2').value.split(/(\s+)/).filter(w=>w);
  const diff = lcsDiff(words1, words2);
  const box = document.getElementById('diffResult');
  box.style.display = 'block';
  box.innerHTML = diff.map(d => {
    if(d.type === 'same') return `<span>${d.text}</span>`;
    if(d.type === 'add') return `<span class="diff-add">${d.text}</span>`;
    return `<span class="diff-del">${d.text}</span>`;
  }).join('');
}
</script>
</body>
