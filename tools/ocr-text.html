<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استخراج النص من الصور OCR | EG.M.Belal</title>
<meta name="description" content="ارفع صورة فيها كلام واستخرج النص منها مباشرة عشان تقدر تنسخه.">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
</head>
<body>
<header>
  <a href="../index.html" class="logo">EG.M.<span>Belal</span></a>
  <a href="../index.html#tools" class="back-link">◀ كل الأدوات</a>
</header>
<div class="container">
  <h1>🔤 استخراج <span>النص من الصور</span></h1>
  <p class="tool-desc">OCR — استخرج أي نص من صورة (عربي أو إنجليزي) وانسخه بنقرة واحدة.</p>
  <div class="card">
    <label>اختار صورة فيها نص:</label>
    <input type="file" id="ocrInput" accept="image/*">
    <label>لغة النص:</label>
    <select id="ocrLang">
      <option value="ara">عربي</option>
      <option value="eng">إنجليزي</option>
      <option value="ara+eng">عربي وإنجليزي معاً</option>
    </select>
    <button class="btn" id="ocrBtn">📤 استخرج النص</button>
    <p class="hint" id="ocrStatus"></p>
    <textarea id="ocrResult" placeholder="النص المستخرج هيظهر هنا..." style="margin-top:15px;"></textarea>
    <button class="btn btn-secondary" onclick="copyToClipboard(document.getElementById('ocrResult').value, this)">📋 نسخ النص</button>
  </div>
</div>
<footer>© 2026 EG.M.Belal</footer>
<script src="assets/common.js"></script>
<script>
let selectedFile = null;
document.getElementById('ocrInput').onchange = (e) => { selectedFile = e.target.files[0]; };

document.getElementById('ocrBtn').onclick = async () => {
  if(!selectedFile){ alert('اختار صورة الأول'); return; }
  const status = document.getElementById('ocrStatus');
  const lang = document.getElementById('ocrLang').value;
  status.textContent = 'جاري تحليل الصورة، ممكن ياخد شوية وقت...';
  try {
    const result = await Tesseract.recognize(selectedFile, lang, {
      logger: m => { if(m.status === 'recognizing text') status.textContent = `جاري التحليل... ${Math.round(m.progress*100)}%`; }
    });
    document.getElementById('ocrResult').value = result.data.text;
    status.textContent = 'تم استخراج النص بنجاح ✓';
  } catch(err){
    status.textContent = 'حصل خطأ أثناء التحليل، جرب صورة أوضح.';
  }
};
</script>
</body>
</html>
